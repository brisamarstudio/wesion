# Wesion — la dashboard. Gira su CONTABO (167.86.125.210).
#
#   docker compose -f docker-compose.dashboard.yml up -d --build
#
# ⚠️ PERCHE' DUE FILE E NON UNO SOLO (01/09/2026). Prima c'era un
# `docker-compose.yml` con dentro tutti e due i servizi e un commento che
# spiegava che in produzione si avviano separatamente. Ma Compose interpola
# TUTTO il file prima di guardare quale servizio gli hai chiesto: su Contabo
# `docker compose build dashboard` si fermava chiedendo `ROUTER_SECRET`, che e'
# una variabile del router e su questa macchina non deve esistere proprio. Un
# file che dichiara una separazione e poi non la permette e' un file che
# racconta una cosa e ne fa un'altra.
#
# La dashboard non pubblica niente: scrive `bozza.stato='approvata'` e il
# router, dall'altra parte, legge. Per questo qui dentro non c'e' NESSUNA
# credenziale di pubblicazione — ne' Google ne' WhatsApp. Se un domani servisse
# metterle qui, la domanda giusta non e' "quale variabile aggiungo" ma "perche'
# la dashboard sta pubblicando".

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wesion-dashboard
    restart: unless-stopped

    # Solo su 127.0.0.1: davanti ci va nginx, che mette il TLS. L'autenticazione
    # adesso c'e', ma restare dietro nginx vale lo stesso — un cookie di
    # sessione mandato in chiaro non protegge nessuno.
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-3020}:3000"

    environment:
      DATABASE_URL: ${DATABASE_URL:?serve DATABASE_URL}
      OCR_MODEL: ${OCR_MODEL:-google/gemini-2.5-flash}
      # La catena: gratis, forfait, a consumo. Nessuna e' obbligatoria da sola,
      # ma senza almeno una non si genera niente.
      GROQ_API_KEY: ${GROQ_API_KEY}
      NARA_API_KEY: ${NARA_API_KEY}
      ZAI_API_KEY: ${ZAI_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?serve OPENROUTER_API_KEY}
      APIFY_API_TOKEN: ${APIFY_API_TOKEN}
      APIFY_ACTOR_ID: ${APIFY_ACTOR_ID:-compass~crawler-google-places}
      SESSION_SECRET: ${SESSION_SECRET:?serve SESSION_SECRET}

    # ⚠️ /entra e non /aziende: da quando c'e' l'autenticazione, /aziende
    # risponde con un redirect al login. Un healthcheck che passa da un
    # redirect dice "sano" anche quando l'unica cosa che funziona e' la porta
    # chiusa — che e' esattamente il tipo di verde bugiardo che il blackout di
    # luglio ha insegnato a non fidarsi.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/entra"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
