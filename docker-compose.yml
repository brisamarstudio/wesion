# Wesion — i due pezzi, che NON stanno sulla stessa macchina.
#
# Sono in un file solo perché sono un progetto solo, ma in produzione si avviano
# separatamente, ognuno sul server che gli serve:
#
#   su Oracle   (92.4.171.2, ARM)   docker compose up -d router
#   su Contabo  (167.86.125.210)    docker compose up -d dashboard
#
# Perché lì e non altrove:
#
#   Il ROUTER deve stare accanto ai container WAHA. Ascolta su 172.17.0.1 —
#   l'interfaccia docker0 dell'host — ed è così che resta raggiungibile dai
#   container sulla stessa macchina e mai da internet. Spostarlo vorrebbe dire
#   esporre WAHA, cioè buttare via una difesa già pagata.
#
#   La DASHBOARD sta dove stanno le altre interfacce dei prodotti, che hanno
#   già nginx e TLS. Non ha nessun motivo di stare su Oracle.
#
# Le due metà non si parlano MAI direttamente: la dashboard scrive
# `bozza.stato='approvata'`, il router legge. Il ponte è il database.

services:
  # ── Il router: WhatsApp, i menù, la pubblicazione ──────────────────────────
  router:
    build:
      context: .
      dockerfile: Dockerfile.router
    container_name: wesion-router
    restart: unless-stopped

    # ⚠️ QUESTA RIGA È IL MOTIVO PER CUI FUNZIONA. Vedi il commento lungo in
    # cima a Dockerfile.router: senza rete host, `127.0.0.1:3006` sarebbe il
    # loopback del container e WAHA non risponderebbe, e non si potrebbe
    # nemmeno ascoltare su 172.17.0.1.
    #
    # Solo Linux. In locale su Windows si prova con `npm run router` — che è
    # come l'abbiamo provato.
    network_mode: host

    environment:
      DATABASE_URL: ${DATABASE_URL:?serve DATABASE_URL}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?serve OPENROUTER_API_KEY}
      OCR_MODEL: ${OCR_MODEL:-google/gemini-2.5-flash}

      ROUTER_HOST: ${ROUTER_HOST:-172.17.0.1}
      ROUTER_PORT: ${ROUTER_PORT:-3010}
      ROUTER_SECRET: ${ROUTER_SECRET:?serve ROUTER_SECRET}

      WAHA_BASE: ${WAHA_BASE:-http://127.0.0.1:3006}
      WAHA_API_KEY: ${WAHA_API_KEY}
      WAHA_SESSION: ${WAHA_SESSION:-default}

      MEDIA_UPLOAD_URL: ${MEDIA_UPLOAD_URL:-https://media.mywebby.it/upload.php}
      MEDIA_UPLOAD_TOKEN: ${MEDIA_UPLOAD_TOKEN}

      GBP_CLIENT_ID: ${GBP_CLIENT_ID}
      GBP_CLIENT_SECRET: ${GBP_CLIENT_SECRET}
      GBP_REFRESH_TOKEN: ${GBP_REFRESH_TOKEN}

      NUMERI_AMMINISTRATORI: ${NUMERI_AMMINISTRATORI}
      DRAFT_TTL_MINUTES: ${DRAFT_TTL_MINUTES:-15}
      MAX_ITEMS: ${MAX_ITEMS:-12}
      SECONDI_GIRO: ${SECONDI_GIRO:-30}

    # Il router risponde su /health senza segreto apposta: serve a sapere se il
    # processo è vivo, e non dice niente che un vicino di rete non possa già
    # dedurre dal fatto che risponde.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://${ROUTER_HOST:-172.17.0.1}:${ROUTER_PORT:-3010}/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s

    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ── La dashboard: aziende, bozze, spie ─────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wesion-dashboard
    restart: unless-stopped

    # Solo su 127.0.0.1: davanti ci va nginx, che mette il TLS. L'autenticazione
    # adesso c'e', ma restare dietro nginx vale lo stesso — un cookie di
    # sessione mandato in chiaro non protegge nessuno.
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-3020}:3000"

    environment:
      DATABASE_URL: ${DATABASE_URL:?serve DATABASE_URL}
      OCR_MODEL: ${OCR_MODEL:-google/gemini-2.5-flash}
      # La catena: gratis, forfait, a consumo. Nessuna e' obbligatoria da sola,
      # ma senza almeno una non si genera niente.
      GROQ_API_KEY: ${GROQ_API_KEY}
      ZAI_API_KEY: ${ZAI_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?serve OPENROUTER_API_KEY}
      APIFY_API_TOKEN: ${APIFY_API_TOKEN}
      APIFY_ACTOR_ID: ${APIFY_ACTOR_ID:-compass~crawler-google-places}
      SESSION_SECRET: ${SESSION_SECRET:?serve SESSION_SECRET}

    # ⚠️ /entra e non /aziende: da quando c'e' l'autenticazione, /aziende
    # risponde con un redirect al login. Un healthcheck che passa da un
    # redirect dice "sano" anche quando l'unica cosa che funziona e' la porta
    # chiusa — che e' esattamente il tipo di verde bugiardo che il blackout di
    # luglio ha insegnato a non fidarsi.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/entra"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
