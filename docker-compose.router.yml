# Wesion — il router. Gira su ORACLE (92.4.171.2, ARM aarch64).
#
#   docker compose -f docker-compose.router.yml up -d --build
#
# ⚠️ L'IMMAGINE SI COSTRUISCE QUI, SUL SERVER. Oracle e' aarch64: un'immagine
# costruita su Windows o su Contabo e' x86 e non parte. `node:22-alpine` e'
# multi-arch, quindi basta fare il build su questa macchina — niente buildx.
#
# ⚠️ PERCHE' NON STA SU CONTABO INSIEME ALLA DASHBOARD. Il router deve stare
# accanto ai container WAHA: ascolta su 172.17.0.1 — l'interfaccia docker0
# dell'host — ed e' cosi' che resta raggiungibile dai container sulla stessa
# macchina e mai da internet. Spostarlo vorrebbe dire esporre WAHA, cioe'
# buttare via una difesa gia' pagata.
#
# Le due meta' non si parlano MAI direttamente: la dashboard scrive
# `bozza.stato='approvata'`, il router legge. Il ponte e' il database.
#
# ⚠️ ROUTER_PORT: sulla 3010 c'e' ancora il router VECCHIO
# (`mywebby-automations`), che serve sei numeri WhatsApp veri. Finche' i webhook
# di WAHA non vengono spostati tenant per tenant — operazione da decidere
# apposta, non un effetto collaterale di un deploy — questo sta su un'altra
# porta e i due convivono. Leggono database diversi, quindi non pubblicano
# mai la stessa cosa due volte.

services:
  router:
    build:
      context: .
      dockerfile: Dockerfile.router
    container_name: wesion-router
    restart: unless-stopped

    # ⚠️ QUESTA RIGA È IL MOTIVO PER CUI FUNZIONA. Vedi il commento lungo in
    # cima a Dockerfile.router: senza rete host, `127.0.0.1:3006` sarebbe il
    # loopback del container e WAHA non risponderebbe, e non si potrebbe
    # nemmeno ascoltare su 172.17.0.1.
    #
    # Solo Linux. In locale su Windows si prova con `npm run router`.
    network_mode: host

    environment:
      DATABASE_URL: ${DATABASE_URL:?serve DATABASE_URL}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?serve OPENROUTER_API_KEY}
      OCR_MODEL: ${OCR_MODEL:-google/gemini-2.5-flash}

      ROUTER_HOST: ${ROUTER_HOST:-172.17.0.1}
      ROUTER_PORT: ${ROUTER_PORT:-3010}
      ROUTER_SECRET: ${ROUTER_SECRET:?serve ROUTER_SECRET}

      WAHA_BASE: ${WAHA_BASE:-http://127.0.0.1:3006}
      WAHA_API_KEY: ${WAHA_API_KEY}
      WAHA_SESSION: ${WAHA_SESSION:-default}

      MEDIA_UPLOAD_URL: ${MEDIA_UPLOAD_URL:-https://media.mywebby.it/upload.php}
      MEDIA_UPLOAD_TOKEN: ${MEDIA_UPLOAD_TOKEN}

      GBP_CLIENT_ID: ${GBP_CLIENT_ID}
      GBP_CLIENT_SECRET: ${GBP_CLIENT_SECRET}
      GBP_REFRESH_TOKEN: ${GBP_REFRESH_TOKEN}

      NUMERI_AMMINISTRATORI: ${NUMERI_AMMINISTRATORI}
      DRAFT_TTL_MINUTES: ${DRAFT_TTL_MINUTES:-15}
      MAX_ITEMS: ${MAX_ITEMS:-12}
      SECONDI_GIRO: ${SECONDI_GIRO:-30}

    # Il router risponde su /health senza segreto apposta: serve a sapere se il
    # processo è vivo, e non dice niente che un vicino di rete non possa già
    # dedurre dal fatto che risponde.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://${ROUTER_HOST:-172.17.0.1}:${ROUTER_PORT:-3010}/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s

    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
